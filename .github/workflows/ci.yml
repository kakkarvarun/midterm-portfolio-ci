
name: CI - Build, Test & Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write   # needed for GHCR

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (no-op for this app)
        run: npm run build

      - name: Run unit/integration tests (fail on test failure)
        run: npm test

      # ---------- Publish to GHCR (main only) ----------
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute GHCR image (lowercase)
        if: github.ref == 'refs/heads/main'
        id: ghcr
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push image to GHCR (latest + sha)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ghcr.outputs.image }}:latest
            ${{ steps.ghcr.outputs.image }}:${{ github.sha }}

      # ---------- Publish to Docker Hub (main only) ----------
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Trim and lowercase the Docker Hub image name safely
      - name: Compute Docker Hub image (trim + lowercase)
        if: github.ref == 'refs/heads/main'
        id: dh
        shell: bash
        run: |
          RAW_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          # trim whitespace/newlines; force lowercase
          USER_LC="$(echo "$RAW_USER" | tr '[:upper:]' '[:lower:]' | xargs)"
          IMAGE="$USER_LC/midterm-portfolio-ci"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushing Docker Hub image: $IMAGE (tags: latest, ${{ github.sha }})"

      - name: Build & push image to Docker Hub (latest + sha)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.dh.outputs.image }}:latest
            ${{ steps.dh.outputs.image }}:${{ github.sha }}

